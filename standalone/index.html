<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Brief · brēf</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #f8fafc 0, #f3f6fa 100%);
            color: #18202b;
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif
        }

        main {
            max-width: 1120px;
            margin: auto;
            padding: 22px 16px 60px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 -16px 24px;
            padding: 14px 16px;
            background: rgba(248, 250, 252, .94);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid #e7ebf0
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 27px;
            letter-spacing: -1.2px
        }

        .brandmark {
            width: 44px;
            height: 44px;
            display: block;
            flex: none;
            object-fit: cover;
            border-radius: 11px
        }

        h1 {
            font-size: 32px;
            letter-spacing: -1px;
            margin: 10px 0 18px
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .primary {
            border: 0;
            background: linear-gradient(135deg, #1477ff, #0966e8);
            box-shadow: 0 7px 18px #1477ff24;
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700
        }

        .search {
            background: white;
            border: 1px solid #e1e7ee;
            border-radius: 13px;
            padding: 13px 15px;
            margin-bottom: 14px;
            box-shadow: 0 1px 3px #0f172a08
        }

        .search input {
            border: 0;
            outline: 0;
            width: 100%;
            font-size: 16px
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow: auto;
            margin-bottom: 14px
        }

        .filters button {
            white-space: nowrap;
            border: 1px solid #dfe4ea;
            background: #fff;
            border-radius: 999px;
            padding: 9px 12px
        }

        .list,
        .card {
            background: white;
            border: 1px solid #e4e8ed;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 10px #1520330b
        }

        .order {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #edf0f3;
            cursor: pointer
        }

        .order:last-child {
            border: 0
        }

        .order strong {
            display: block;
            margin: 4px 0
        }

        .muted,
        small {
            color: #75808f
        }

        .badge {
            font-size: 13px;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 999px
        }

        .red {
            background: #ffe7e7;
            color: #b72b2b
        }

        .yellow {
            background: #fff3c7;
            color: #936b00
        }

        .green {
            background: #def7e7;
            color: #19713b
        }

        .back {
            border: 0;
            background: transparent;
            padding: 8px 0;
            margin-bottom: 8px;
            color: #52606f
        }

        .card {
            padding: 18px;
            margin: 12px 0
        }

        .form label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin: 12px 0
        }

        .form input,
        .form textarea,
        .form select,
        .compose input,
        .invite select {
            width: 100%;
            border: 1px solid #dce2e8;
            border-radius: 10px;
            padding: 12px;
            margin-top: 6px;
            background: #fff
        }

        .form textarea {
            min-height: 90px;
            resize: vertical
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .auto {
            padding: 12px;
            border-radius: 11px;
            background: #eef5ff
        }

        .full {
            width: 100%;
            margin-top: 14px
        }

        .title {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center
        }

        .info p,
        .rowlink {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 0;
            margin: 0;
            border: 0;
            border-bottom: 1px solid #edf0f3;
            background: transparent;
            text-align: left
        }

        .info p:last-child {
            border: 0
        }

        .info small,
        .info b {
            display: block
        }

        .statusBtns {
            display: flex;
            gap: 8px
        }

        .statusBtns button {
            flex: 1;
            border: 1px solid #dce2e8;
            background: #fff;
            padding: 10px;
            border-radius: 10px
        }

        .statusBtns .active {
            border-color: #1477ff;
            background: #eef5ff;
            color: #1266d6;
            font-weight: 700
        }

        .compose,
        .invite {
            display: flex;
            gap: 8px
        }

        .compose input,
        .invite select {
            margin: 0
        }

        .compose button,
        .invite button {
            border: 0;
            background: #1477ff;
            color: white;
            border-radius: 10px;
            padding: 0 14px
        }

        .entry {
            border-top: 1px solid #edf0f3;
            margin-top: 12px;
            padding-top: 12px
        }

        .upload {
            display: inline-block;
            background: #eef5ff;
            color: #1266d6;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 700
        }

        .upload input {
            display: none
        }

        .person {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #edf0f3
        }

        .person small {
            display: block;
            margin-top: 3px
        }

        .timeline p {
            border-left: 2px solid #c9ddff;
            padding-left: 13px;
            margin: 15px 0
        }

        .projectlist {
            background: white;
            border: 1px solid #e4e8ed;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 10px #1520330b
        }

        .projectrow {
            display: grid;
            grid-template-columns: 1fr .9fr 1.35fr 1.7fr 1.15fr 1.05fr 1.45fr;
            gap: 12px;
            align-items: center;
            padding: 15px 16px;
            border-bottom: 1px solid #edf0f3
        }

        .projectrow:last-child {
            border: 0
        }

        .projectrow.head {
            background: #f8fafc;
            color: #75808f;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .03em
        }

        .projectrow b {
            font-size: 14px
        }

        .projectrow span {
            font-size: 14px
        }

        .projectrow:not(.head) {
            transition: .16s ease
        }

        .projectrow:not(.head):hover {
            background: #f8fbff;
            transform: translateY(-1px)
        }

        .projectName {
            display: flex;
            align-items: center;
            gap: 11px
        }

        .thumb {
            width: 58px;
            height: 42px;
            object-fit: cover;
            border-radius: 9px;
            border: 1px solid #dfe5eb;
            box-shadow: 0 2px 8px #0f172a18;
            flex: none
        }

        .hero {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px
        }

        .sectionTitle {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            margin: 12px 0 16px
        }

        .stat {
            background: #fff;
            border: 1px solid #e5eaf0;
            border-radius: 13px;
            padding: 11px 13px
        }

        .stat b {
            display: block;
            font-size: 18px
        }

        .stat small {
            font-size: 11px
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px
        }

        .bottomnav {
            display: none
        }

        .comment {
            color: #667281
        }

        .hidden {
            display: none
        }

        @media(max-width:700px) {
            main {
                padding-bottom: 86px
            }

            .projectlist {
                background: transparent;
                border: 0;
                box-shadow: none;
                overflow: visible
            }

            .projectrow.head {
                display: none
            }

            .projectrow {
                display: grid;
                grid-template-columns: 1fr auto;
                background: #fff;
                border: 1px solid #e4e8ed;
                border-radius: 16px;
                margin-bottom: 10px;
                padding: 12px;
                box-shadow: 0 3px 12px #0f172a0b
            }

            .projectrow span:nth-child(1),
            .projectrow span:nth-child(2) {
                font-size: 11px;
                color: #75808f
            }

            .projectrow span:nth-child(3) {
                grid-column: 1/2;
                font-size: 12px;
                color: #657181
            }

            .projectrow span:nth-child(4) {
                grid-column: 1/2;
                grid-row: 1/4
            }

            .projectrow span:nth-child(5) {
                grid-column: 1/2;
                font-size: 12px;
                color: #657181;
                padding-left: 69px
            }

            .projectrow span:nth-child(6) {
                grid-column: 2;
                grid-row: 1/3
            }

            .projectrow span:nth-child(7) {
                grid-column: 1/3;
                font-size: 12px;
                color: #657181;
                padding-top: 8px;
                border-top: 1px solid #eef1f4
            }

            .projectrow span:nth-child(1),
            .projectrow span:nth-child(2),
            .projectrow span:nth-child(3) {
                padding-left: 69px
            }

            .projectName {
                min-height: 46px
            }

            .thumb {
                width: 58px;
                height: 46px
            }

            .bottomnav {
                display: flex;
                position: fixed;
                z-index: 30;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, .96);
                backdrop-filter: blur(16px);
                border-top: 1px solid #e5e9ef;
                justify-content: space-around;
                padding: 9px 8px max(9px, env(safe-area-inset-bottom))
            }

            .bottomnav button {
                border: 0;
                background: transparent;
                color: #6b7684;
                font-size: 11px
            }

            .bottomnav button.active {
                color: #126ee8;
                font-weight: 800
            }

            .bottomnav b {
                display: block;
                font-size: 18px;
                margin-bottom: 2px
            }
        }

        @media(max-width:600px) {
            main {
                padding: 16px 12px 40px
            }

            h1 {
                font-size: 26px
            }

            .primary {
                padding: 10px 12px
            }

            .order {
                grid-template-columns: 1fr auto
            }

            .order .chev {
                display: none
            }

            .badge {
                font-size: 12px
            }

            .two {
                grid-template-columns: 1fr
            }

            .title {
                align-items: flex-start
            }

            .statusBtns {
                flex-direction: column
            }
        }
    </style>
    <link rel="stylesheet" href="brief.css">
</head>

<body>
    <main>
        <header><button class="logo" id="home" aria-label="Brief projektöversikt"><img src="assets/brief-horizontal.png"
                    alt="brēf" class="brand-image"></button><label class="demo-user">Demoperson<select
                    id="user"></select></label><button id="newBtn" class="primary">＋ Ny arbetsorder</button></header>
        <div class="demo-info">Brief v0.1 · Demoläge · Sparas på den här enheten</div>
        <div id="notice" role="status"></div>
        <div id="app"></div>
    </main>
    <nav class="bottomnav"><button id="navProjects"><b>⌂</b>Projekt</button><button id="navNew"><b>＋</b>Ny
            order</button><button id="navAdmin"><b>☰</b>Team</button></nav>
    <script src="brief.js"></script>
</body>

</html>
